<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>폴겟 링크</title>
  <meta name="description" content="폴겟(Forget) 설치와 영상 속 자료 모음">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <style>
    :root { --g: #1F7A4D; --ink: #16211B; --muted: #5F6E66; --bg: #F5F8F5; --line: #D9E3DD; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; line-height: 1.55; }
    main { max-width: 440px; margin: 0 auto; padding: 32px 20px 60px; }
    .head { text-align: center; }
    .head img { width: 72px; height: 72px; border-radius: 18px; }
    .head h1 { font-size: 20px; margin: 12px 0 4px; }
    .head p { margin: 0; color: var(--muted); font-size: 14px; }
    .install { display: block; margin: 22px 0 8px; padding: 15px 18px; border-radius: 12px; background: var(--g); color: #fff; text-decoration: none; font-weight: 700; text-align: center; font-size: 16px; }
    .sub { text-align: center; color: var(--muted); font-size: 12.5px; margin: 0 0 26px; }
    h2 { font-size: 13px; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; margin: 0 0 10px; }
    .list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 26px; }
    .item { display: block; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); text-decoration: none; }
    .item b { display: block; font-size: 15px; }
    .item span { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
    .item.soon { opacity: .6; }
    .foot { text-align: center; color: var(--muted); font-size: 12.5px; }
    .foot a { color: var(--g); text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="head">
      <img src="/assets/forget-icon.png" alt="폴겟" width="72" height="72">
      <h1>폴겟 · Forget</h1>
      <p>기억하지 마세요, 폴겟하세요</p>
    </div>

    <a class="install" id="install" href="/get">폴겟 설치하기</a>
    <p class="sub">iOS App Store · Android Google Play</p>

    <h2>영상 속 자료</h2>
    <div class="list" id="episodes"></div>

    <h2>더 보기</h2>
    <div class="list">
      <a class="item" href="/"><b>폴겟 소개</b><span>어떤 앱인지 1분 안에</span></a>
      <a class="item" href="/support.html"><b>문의·도움말</b><span>forgetappkr@gmail.com</span></a>
    </div>

    <p class="foot"><a href="/privacy.html">개인정보처리방침</a> · <a href="/terms.html">이용약관</a></p>
  </main>
  <script>
    // 회차 목록 — 주간 파이프라인이 이 배열만 갱신한다 (최근 3개만 노출, 오래된 회차는 위에서부터 밀려남)
    var EPISODES = [
      // { id: 's4-01', title: '④-01 전시 가기 전: 예약·입구·주차', desc: '이번 주말 준비물 보관함', url: 'https://forgetapp.kr/s/?id=…' },
    ];
    (function () {
      var q = new URLSearchParams(location.search);
      var c = (q.get('c') || 'links').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 64) || 'links';
      document.getElementById('install').href = '/get?c=' + encodeURIComponent(c);
      var box = document.getElementById('episodes');
      var eps = EPISODES.slice(-3).reverse();
      if (!eps.length) {
        var a = document.createElement('div'); a.className = 'item soon';
        a.innerHTML = '<b>첫 회차 준비 중</b><span>영상에 나온 자료를 여기에 모아둡니다</span>';
        box.appendChild(a); return;
      }
      eps.forEach(function (e) {
        var a = document.createElement('a'); a.className = 'item'; a.href = e.url; a.target = '_blank'; a.rel = 'noopener';
        var b = document.createElement('b'); b.textContent = e.title; a.appendChild(b);
        var s = document.createElement('span'); s.textContent = e.desc || ''; a.appendChild(s);
        box.appendChild(a);
      });
    })();
  </script>
</body>
</html>
