<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>폴겟 다운로드</title>
  <meta name="description" content="폴겟(Forget) 설치 링크 — 기기에 맞는 스토어로 이동합니다.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <style>
    :root { --g: #1F7A4D; --ink: #16211B; --muted: #5F6E66; --bg: #F5F8F5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; line-height: 1.6; }
    main { text-align: center; padding: 32px 24px; max-width: 420px; }
    img.logo { width: 84px; height: 84px; border-radius: 20px; }
    h1 { font-size: 22px; margin: 18px 0 6px; }
    p { margin: 0 0 18px; color: var(--muted); font-size: 15px; }
    .btn { display: block; padding: 14px 18px; border-radius: 12px; background: var(--g); color: #fff; text-decoration: none; font-weight: 600; margin: 10px 0; }
    .btn.secondary { background: #fff; color: var(--ink); border: 1px solid #D9E3DD; }
    .small { font-size: 13px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/assets/forget-icon.png" alt="폴겟 로고" width="84" height="84">
    <h1>기억하지 마세요, 폴겟하세요</h1>
    <p id="msg">스토어로 이동합니다…</p>
    <a id="ios" class="btn" href="https://apps.apple.com/kr/app/id6793758380">App Store에서 받기</a>
    <a id="android" class="btn hidden" href="https://play.google.com/store/apps/details?id=kr.forgetapp.forget">Google Play에서 받기</a>
    <a id="home" class="btn secondary hidden" href="/">폴겟 소개 보기</a>
    <p class="small">iOS App Store · Android Google Play 정식 출시</p>
  </main>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var c = (q.get('c') || 'direct').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 64) || 'direct';
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      var platform = isIOS ? 'ios' : isAndroid ? 'android' : 'desktop';

      // App Store 캠페인 파라미터: pt(제공자 토큰)는 App Store Connect > 앱 분석 > 캠페인에서 발급 후 채운다.
      // pt 없이 ct만 보내면 애플이 무시하므로, 현재는 서버 집계(track-link)가 방문 출처를 담당한다.
      var APPLE_PT = '';
      var iosUrl = 'https://apps.apple.com/kr/app/id6793758380' + (APPLE_PT ? '?pt=' + APPLE_PT + '&ct=' + encodeURIComponent(c) + '&mt=8' : '');
      // 안드로이드 정식 출시 (2026-09-19): Play 링크 + referrer UTM — Play Console 획득 보고서에서 캠페인별로 보인다
      var ANDROID_URL = 'https://play.google.com/store/apps/details?id=kr.forgetapp.forget&referrer=' +
        encodeURIComponent('utm_source=forget_get&utm_medium=smartlink&utm_campaign=' + c);

      // 방문 집계 (개인정보 없음: 캠페인·플랫폼·리퍼러 호스트만)
      try {
        fetch('https://gyxeysskppzdrikdtfju.supabase.co/functions/v1/track-link', {
          method: 'POST', keepalive: true, mode: 'cors',
          headers: { 'content-type': 'text/plain' },
          body: JSON.stringify({ c: c, p: platform, r: document.referrer || '' })
        }).catch(function () {});
      } catch (e) {}

      var ios = document.getElementById('ios'), android = document.getElementById('android'), home = document.getElementById('home'), msg = document.getElementById('msg');
      ios.href = iosUrl;
      android.href = ANDROID_URL;
      if (isIOS) {
        setTimeout(function () { location.href = iosUrl; }, 400);
      } else if (isAndroid) {
        ios.classList.add('hidden'); android.classList.remove('hidden');
        setTimeout(function () { location.href = ANDROID_URL; }, 400);
      } else {
        msg.textContent = '휴대폰에서 이 페이지를 열면 스토어로 바로 이동합니다.';
        android.classList.remove('hidden');
        home.classList.remove('hidden');
      }
    })();
  </script>
</body>
</html>
